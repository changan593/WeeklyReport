[package]
name = "weekly-report"
version = "0.1.1"
description = "AI-powered weekly report generator from Claude Code / Codex CLI logs."
authors = ["WeeklyReport contributors"]
license = "MIT"
repository = "https://github.com/changan593/WeeklyReport"
edition = "2021"
rust-version = "1.77"

# 缩小 release 二进制：去符号、LTO、单 codegen 单元、panic=abort
# 见 docs/SPEC.md#6-性能要求（二进制 < 10 MB）
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
tokio-cron-scheduler = "0.11"
cron = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
