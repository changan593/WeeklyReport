name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos-x86_64
            os: macos-latest
            rust-target: x86_64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev

      - name: npm install
        run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WeeklyReport ${{ github.ref_name }}'
          releaseBody: |
            自动构建产物 —— 详细变更见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md)。

            ## 平台支持

            - macOS arm64 / x86_64：`.dmg`
            - Linux x86_64：`.AppImage` / `.deb`
            - Windows x86_64：`.msi` / `.exe`

            ## 校验

            ```bash
            shasum -a 256 <下载的文件>
            ```
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}
